<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur Kelas Modern</title>
    <!-- Memanggil file CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <h1 class="reveal">Struktur Organisasi Kelas</h1>
        <p class="reveal">Tahun Ajaran 2026/2027</p>
    </header>

    <main class="org-chart">
        <!-- Level 1: Wali Kelas -->
        <div class="tier reveal">
            <div class="card skeleton">
                <div class="avatar skeleton-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Wali" alt="Wali Kelas">
                </div>
                <div class="info">
                    <h3 class="skeleton-text">Bpk. Budi Santoso</h3>
                    <p class="skeleton-text role">Wali Kelas</p>
                </div>
            </div>
        </div>

        <!-- Garis Penghubung -->
        <div class="line reveal"></div>

        <!-- Level 2: Ketua Kelas -->
        <div class="tier reveal">
            <div class="card skeleton">
                <div class="avatar skeleton-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Ketua" alt="Ketua Kelas">
                </div>
                <div class="info">
                    <h3 class="skeleton-text">Ahmad Rizki</h3>
                    <p class="skeleton-text role">Ketua Kelas</p>
                </div>
            </div>
        </div>

        <div class="line reveal"></div>

        <!-- Level 3: Wakil Ketua -->
        <div class="tier reveal">
            <div class="card skeleton">
                <div class="avatar skeleton-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Wakil" alt="Wakil Ketua">
                </div>
                <div class="info">
                    <h3 class="skeleton-text">Siti Nurhaliza</h3>
                    <p class="skeleton-text role">Wakil Ketua</p>
                </div>
            </div>
        </div>

        <div class="line-split reveal"></div>

        <!-- Level 4: Sekretaris & Bendahara -->
        <div class="tier split reveal">
            <div class="card skeleton">
                <div class="avatar skeleton-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sekretaris" alt="Sekretaris">
                </div>
                <div class="info">
                    <h3 class="skeleton-text">Diana Putri</h3>
                    <p class="skeleton-text role">Sekretaris</p>
                </div>
            </div>

            <div class="card skeleton">
                <div class="avatar skeleton-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Bendahara" alt="Bendahara">
                </div>
                <div class="info">
                    <h3 class="skeleton-text">Kevin Sanjaya</h3>
                    <p class="skeleton-text role">Bendahara</p>
                </div>
            </div>
        </div>

        <!-- Level 5: Divisi / Seksi -->
        <h2 class="section-title reveal">Seksi - Seksi</h2>
        <div class="tier grid reveal">
            <div class="card skeleton">
                <div class="avatar skeleton-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Keamanan" alt="Keamanan">
                </div>
                <div class="info">
                    <h3 class="skeleton-text">Bima Arya</h3>
                    <p class="skeleton-text role">Keamanan</p>
                </div>
            </div>

            <div class="card skeleton">
                <div class="avatar skeleton-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Kebersihan" alt="Kebersihan">
                </div>
                <div class="info">
                    <h3 class="skeleton-text">Rina Nose</h3>
                    <p class="skeleton-text role">Kebersihan</p>
                </div>
            </div>
            
            <div class="card skeleton">
                <div class="avatar skeleton-img">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Olahraga" alt="Olahraga">
                </div>
                <div class="info">
                    <h3 class="skeleton-text">Taufik H.</h3>
                    <p class="skeleton-text role">Olahraga & Seni</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Memanggil file JavaScript -->
    <script src="script.js"></script>
</body>
  </html>
